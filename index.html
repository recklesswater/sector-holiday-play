<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#07040f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="星区假日大亨" />
    <title>星区假日大亨 · 加密入口</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #07040f; }
      body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; color: #f8f3ff; }
      #gate { box-sizing: border-box; min-height: 100%; display: grid; place-items: center; padding: 28px; }
      .card { width: min(420px, 100%); padding: 28px 24px; border: 1px solid rgba(192,132,252,.45); border-radius: 22px; background: linear-gradient(160deg, #21163b, #100a20); box-shadow: 0 24px 80px rgba(0,0,0,.45); }
      .kicker { color: #c084fc; font-size: 12px; letter-spacing: .18em; }
      h1 { margin: 12px 0 8px; font-size: 30px; }
      p { margin: 0 0 22px; color: #a99bc4; line-height: 1.65; font-size: 14px; }
      label { display: block; margin-bottom: 8px; color: #d9cde9; font-size: 12px; }
      input { box-sizing: border-box; width: 100%; height: 50px; padding: 0 14px; border: 1px solid #46336d; border-radius: 12px; background: #130c24; color: #fff; font-size: 16px; outline: none; }
      input:focus { border-color: #c084fc; box-shadow: 0 0 0 3px rgba(192,132,252,.16); }
      button { width: 100%; height: 50px; margin-top: 14px; border: 0; border-radius: 12px; background: #c084fc; color: #20160a; font-size: 16px; font-weight: 800; }
      button:disabled { opacity: .55; }
      #error { min-height: 20px; margin-top: 12px; color: #ff6b85; font-size: 13px; }
      #game { display: none; position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #07040f; }
      .note { margin-top: 18px; color: #6f6288; font-size: 11px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main id="gate">
      <section class="card">
        <div class="kicker">SECTOR HOLIDAY TYCOON</div>
        <h1>星区假日大亨</h1>
        <p>这是加密的单文件试玩入口。输入发布者单独提供的访问口令后，游戏才会在本机解密并启动。</p>
        <label for="password">访问口令</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="输入访问口令" />
      <button id="unlock" type="button">进入星区</button>
        <div id="error" role="alert"></div>
        <div class="note">页面不保存口令。入口可添加到主屏幕，之后不需要电脑保持在线。</div>
      </section>
    </main>
    <iframe id="game" title="星区假日大亨" allow="autoplay"></iframe>
    <script>
      const salt = "tZsyPtwaZaWtsc7lsu2jXA==";
      const iv = "tMRnrWxY/58NjCRP";
      const iterations = 100000;
      const input = document.getElementById('password');
      const button = document.getElementById('unlock');
      const error = document.getElementById('error');
      const frame = document.getElementById('game');
      const status = document.createElement('div');
      status.className = 'note';
      status.setAttribute('aria-live', 'polite');
      button.after(status);
      const fromBase64 = (value) => Uint8Array.from(atob(value), (char) => char.charCodeAt(0));
      const workerSource = `
        self.onmessage = async (event) => {
          try {
            const data = event.data;
            const material = await crypto.subtle.importKey(
              'raw',
              new TextEncoder().encode(data.password),
              'PBKDF2',
              false,
              ['deriveKey'],
            );
            const key = await crypto.subtle.deriveKey(
              { name: 'PBKDF2', salt: data.salt, iterations: data.iterations, hash: 'SHA-256' },
              material,
              { name: 'AES-GCM', length: 256 },
              false,
              ['decrypt'],
            );
            const bytes = new Uint8Array(data.payload);
            const tag = bytes.slice(-16);
            const encrypted = bytes.slice(0, -16);
            const combined = new Uint8Array(encrypted.length + tag.length);
            combined.set(encrypted);
            combined.set(tag, encrypted.length);
            const plain = await crypto.subtle.decrypt(
              { name: 'AES-GCM', iv: data.iv, tagLength: 128 },
              key,
              combined,
            );
            self.postMessage({ ok: true, plain }, [plain]);
          } catch (error) {
            self.postMessage({ ok: false, error: String(error) });
          }
        };
      `;
      async function unlock() {
        error.textContent = '';
        button.disabled = true;
        status.textContent = '正在后台解密，请稍候…';
        try {
          const payload = await fetch('./payload.bin', { cache: 'force-cache' }).then((response) => {
            if (!response.ok) throw new Error('payload unavailable');
            return response.arrayBuffer();
          });
          const worker = new Worker(URL.createObjectURL(new Blob([workerSource], { type: 'text/javascript' })));
          worker.onmessage = (event) => {
            worker.terminate();
            if (!event.data.ok) {
              error.textContent = '口令不正确，请重新输入。';
              status.textContent = '';
              button.disabled = false;
              return;
            }
            status.textContent = '正在启动星区…';
            requestAnimationFrame(() => {
              frame.srcdoc = new TextDecoder().decode(event.data.plain);
              document.getElementById('gate').style.display = 'none';
              frame.style.display = 'block';
            });
          };
          worker.onerror = () => {
            worker.terminate();
            error.textContent = '解密线程启动失败，请刷新后重试。';
            status.textContent = '';
            button.disabled = false;
          };
          worker.postMessage({
            password: input.value,
            salt: fromBase64(salt),
            iv: fromBase64(iv),
            iterations,
            payload,
          }, [payload]);
        } catch (cause) {
          error.textContent = '入口加载失败，请检查网络后重试。';
          status.textContent = '';
          button.disabled = false;
        }
      }
      button.addEventListener('click', unlock);
      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') unlock();
      });
    </script>
  </body>
</html>
