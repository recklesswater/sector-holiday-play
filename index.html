      const input = document.getElementById('password');
      const button = document.getElementById('unlock');
      const error = document.getElementById('error');
      const frame = document.getElementById('game');
      const fromBase64 = (value) => Uint8Array.from(atob(value), (char) => char.charCodeAt(0));
      async function unlock() {
        error.textContent = '';
        button.disabled = true;
        try {
          const material = await crypto.subtle.importKey(
            'raw',
            new TextEncoder().encode(input.value),
            'PBKDF2',
            false,
            ['deriveKey'],
          );
          const key = await crypto.subtle.deriveKey(
            { name: 'PBKDF2', salt: fromBase64(salt), iterations, hash: 'SHA-256' },
            material,
            { name: 'AES-GCM', length: 256 },
            false,
            ['decrypt'],
          );
          const bytes = fromBase64(payload);
          const tag = bytes.slice(-16);
          const encrypted = bytes.slice(0, -16);
          const combined = new Uint8Array(encrypted.length + tag.length);
          combined.set(encrypted);
          combined.set(tag, encrypted.length);
          const plain = await crypto.subtle.decrypt(
            { name: 'AES-GCM', iv: fromBase64(iv), tagLength: 128 },
            key,
            combined,
          );
          frame.srcdoc = new TextDecoder().decode(plain);
          document.getElementById('gate').style.display = 'none';
          frame.style.display = 'block';
        } catch (cause) {
          error.textContent = '口令不正确，请重新输入。';
        } finally {
          button.disabled = false;
        }
      }
      button.addEventListener('click', unlock);
      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') unlock();
      });
    </script>
