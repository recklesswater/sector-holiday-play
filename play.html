      function gameLayout(app) {

        const playerH = playerRows * 56 + (playerRows - 1) * 4;
        const boardTopBase = playerY + playerH + 8;
        const chainH = 56;
        const handH = 58;
        const actionH = 42;
        const actionY = height - app.safeBottom - actionH;
        let cell = Math.min((width - 10) / 12, 36);
        const maxBoardHeight = actionY - boardTopBase - chainH - handH - 18;
        cell = Math.min(cell, Math.max(20, Math.floor(maxBoardHeight / ROWS)));
        const boardW = cell * 12;
        const boardH = cell * ROWS;
        let boardTop = boardTopBase;
        let chainTop = boardTop + boardH + 8;
        let handTop = chainTop + chainH + 8;
        const spare = actionY - (handTop + handH + 8);
        if (spare > 0) {
          const extra = Math.min(spare, 150);
          boardTop += extra * 0.22;
          chainTop += extra * 0.34;
          handTop += extra * 0.44;
        }
        return {
          headerY,
          headerH,
          playerY,
          playerH,
          boardTop,
          boardX: (width - boardW) / 2,
          boardW,
          boardH,
          cell,
          chainTop,
          chainH,
          handTop,
          handH,
          actionY,
          actionH
        };

      function drawImageCover(ctx, image, x, y, width, height) {
        const imageAspect = image.width / image.height;
        const targetAspect = width / height;
        let sourceX = 0;
        let sourceY = 0;
        let sourceWidth = image.width;
        let sourceHeight = image.height;
        if (imageAspect > targetAspect) {
          sourceWidth = image.height * targetAspect;
          sourceX = (image.width - sourceWidth) / 2;
        } else {
          sourceHeight = image.width / targetAspect;
          sourceY = (image.height - sourceHeight) * 0.12;
        }
        ctx.drawImage(
          image,
          sourceX,
          sourceY,
          sourceWidth,
          sourceHeight,
          x,
          y,
          width,
          height
        );
      }

      function drawOverlay(ctx, app) {
        if (app.overlay === "cash") {
          drawCash(ctx, app);

          drawPause(ctx, app);
        } else if (app.overlay === "chooseChain") {
          drawChooseChain(ctx, app);
        } else if (app.overlay === "chooseSurvivor") {
          drawChooseSurvivor(ctx, app);
        } else if (app.overlay === "buy") {
          drawBuy(ctx, app);
        } else if (app.overlay === "merge") {
          drawMerge(ctx, app);
        }
      }
      function drawToast(ctx, app) {
        if (!app.toastText || Date.now() > app.toastUntil) {
          return;
        }
        const remaining = app.toastUntil - Date.now();
        const alpha = Math.min(1, remaining / 260);
        ctx.save();
        ctx.globalAlpha = alpha;
        const maxWidth = app.width - 36;
        ctx.font = font(11, "500");
        const measured = ctx.measureText(app.toastText).width;
        const boxW = Math.min(maxWidth, measured + 28);
        const boxX = (app.width - boxW) / 2;
        const boxY = app.safeTop + 54;
        panel(ctx, boxX, boxY, boxW, 30, 15, "rgba(23,16,43,0.96)", "rgba(192,132,252,0.28)");
        text(
          ctx,
          clampText(ctx, app.toastText, boxW - 24),
          app.width / 2,
          boxY + 15,
          10.5,
          COLORS.text,
          "500",
          "center"
        );
        ctx.restore();
      }

      function drawApp(ctx, app, width, height, time) {
        drawBackground(ctx, width, height, time);
        if (app.screen === "home") {
          drawHome(ctx, app);
        } else if (app.screen === "lobby") {
          drawLobby(ctx, app);
        } else if (app.screen === "rules") {
          drawRules(ctx, app);
        } else if (app.screen === "result") {
          drawResult(ctx, app);
        } else if (app.screen === "game" && app.game) {
          drawGameBase(ctx, app);
          if (app.overlay) {
            drawOverlay(ctx, app);
          }
          if (app.handoff) {
            drawHandoff(ctx, app);
          }
        }

      app.screen = "game";
      app.overlay = "buy";
      app.handoff = null;
      app.buyDraft = { kuiper: 2 };
    } else if (mode === "buy7") {
      app.game = buySevenScenario();
      app.screen = "game";
      app.overlay = "buy";
      app.handoff = null;
      app.buyDraft = { kuiper: 1, orion: 1, lunar: 1 };
    } else if (mode === "result") {
      app.game = resultScenario();
      app.screen = "result";
    } else if (mode === "rules") {
      app.openRules(0);
    }
  }, 80);
})();
</script>
